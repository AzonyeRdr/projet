<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>API Test</title>
</head>
<body>
  <h1>API Test</h1>
  <button id="btn-hello">Call GET /api/hello</button>
  <pre id="result"></pre>

  <script>
    document.getElementById('btn-hello').addEventListener('click', async () => {
      const res = await fetch(window.location.origin + '/api/hello');
      const text = await res.text();
      document.getElementById('result').textContent = text;
    });
  </script>
</body>
</html>
